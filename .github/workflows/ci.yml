name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR updates supersede old development runs. Main and immutable release tags
# retain independent groups: even a queued run must not be replaced by a push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux x64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Permit Chromium namespaces in disposable build containers
        run: sudo apparmor_parser -r -W desktop/linux/work-fold-linux-build.apparmor
      - name: Build Ubuntu packaging environment
        run: docker build --build-arg WORKFOLD_BUILD_UID="$(id -u)" --build-arg WORKFOLD_BUILD_GID="$(id -g)" -t work-fold-linux-build desktop/linux
      - name: Verify and package Linux
        id: linux-package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
            -v "$PWD:/work" -e HOME=/tmp/work-fold-build work-fold-linux-build \
            bash -lc 'unshare --user --map-root-user --pid --net --fork true && mkdir -p "$HOME" && npm ci && npm run check && npm run desktop:computer-helper && npm run desktop:linux-native-hosts && npm run desktop:linux-native-tests && npm test && dbus-run-session -- xvfb-run -a npm run desktop:make:linux'
      - name: Test encrypted credentials across keyring restarts
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
            -v "$PWD:/work:ro" -e WORKFOLD_CONTAINER_INSTALL_TEST=1 work-fold-linux-build \
            runuser -u ubuntu -- bash /work/scripts/linux-credentials-smoke.sh
      - name: Test native GNOME sharing on Ubuntu and Fedora
        run: |
          docker build -f scripts/linux-wayland-probe/Dockerfile.gnome-test -t work-fold-gnome-acceptance scripts/linux-wayland-probe
          docker build -f scripts/linux-wayland-probe/Dockerfile.fedora-test -t work-fold-gnome-fedora-acceptance scripts/linux-wayland-probe
          for image in work-fold-gnome-acceptance work-fold-gnome-fedora-acceptance; do
            layout=us
            if [ "$image" = work-fold-gnome-fedora-acceptance ]; then layout=de; fi
            docker run --rm --user 1000:1000 --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
              -v "$PWD:/work:ro" -e HOME=/tmp/workfold-gnome-home -e WORKFOLD_ISOLATED_GNOME_TEST=1 \
              -e WORKFOLD_NATIVE_TEST_SIZE=2880x1800 -e WORKFOLD_NATIVE_TEST_LAYOUT="$layout" \
              -e WORKFOLD_NATIVE_TEST_LIVE_SCALE=1 "$image" \
              bash -euc 'mkdir -p "$HOME"; bash /work/scripts/linux-wayland-probe/acceptance.sh'
            docker run --rm --user 1000:1000 --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
              -v "$PWD:/work:ro" -e HOME=/tmp/workfold-gnome-home -e WORKFOLD_ISOLATED_GNOME_TEST=1 \
              -e WORKFOLD_NATIVE_TEST_SECOND_MONITOR=2560x1440 "$image" \
              bash -euc 'mkdir -p "$HOME"; bash /work/scripts/linux-wayland-probe/acceptance.sh'
            for transform in 1 2 3; do
              docker run --rm --user 1000:1000 --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
                -v "$PWD:/work:ro" -e HOME=/tmp/workfold-gnome-home -e WORKFOLD_ISOLATED_GNOME_TEST=1 \
                -e WORKFOLD_NATIVE_TEST_TRANSFORM="$transform" "$image" \
                bash -euc 'mkdir -p "$HOME"; bash /work/scripts/linux-wayland-probe/acceptance.sh'
            done
            docker run --rm --user 1000:1000 --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
              -v "$PWD:/work:ro" -e HOME=/tmp/workfold-gnome-home -e WORKFOLD_ISOLATED_GNOME_TEST=1 "$image" \
              bash -euc 'mkdir -p "$HOME"; bash /work/scripts/linux-wayland-probe/desktop-acceptance.sh'
          done
      - name: Test AppImage workflow and unsafe-launch refusal
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
            -v "$PWD:/work:ro" work-fold-linux-build \
            runuser -u ubuntu -- dbus-run-session -- xvfb-run -a bash -euc \
            'export APPIMAGE_EXTRACT_AND_RUN=1; node /work/scripts/linux-sandbox-smoke.mjs /work/out/linux/*.AppImage --launcher-fallback; node /work/scripts/linux-installed-smoke.mjs /work/out/linux/*.AppImage /work/out/linux/linux-unpacked/bin/work-fold'
      - name: Test DEB installation and removal
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
            -v "$PWD:/work:ro" -e WORKFOLD_CONTAINER_INSTALL_TEST=1 work-fold-linux-build \
            bash -c 'bash /work/scripts/linux-deb-install-smoke.sh /work/out/linux/*.deb'
      - name: Test RPM installation and removal on Fedora
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=work-fold-linux-build \
            -v "$PWD:/work:ro" -e WORKFOLD_CONTAINER_INSTALL_TEST=1 registry.fedoraproject.org/fedora:44 \
            bash -c 'dnf install -y nodejs24-bin xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon gnome-keyring && useradd --create-home --uid 1000 smoke && bash /work/scripts/linux-rpm-install-smoke.sh /work/out/linux/*.rpm'
      - name: Save Linux candidate and verification record
        # Retain successfully built bytes even when a later acceptance step
        # fails. The run's result still determines qualification.
        if: ${{ !cancelled() && steps.linux-package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-candidate-${{ github.run_attempt }}
          path: |
            out/linux/*.deb
            out/linux/*.rpm
            out/linux/*.AppImage
            out/linux/SHA256SUMS
            out/linux/linux-build.json
            out/linux/*-linux-build.json
            out/linux/*-linux-source.json
            out/linux/*-linux-source.tar.gz
            out/linux/*.cdx.json
          if-no-files-found: error
          retention-days: 14

  types:
    name: Repository & TypeScript
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check

  tests:
    name: Application tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  bridge:
    name: Web bridge tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/bridge/package-lock.json
      - run: npm ci --prefix services/bridge
      - run: npm test --prefix services/bridge

  desktop:
    name: Electron integration
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
        env:
          WORKFOLD_RESTRICTED_SMOKE_LOG: out/ci/restricted-app-smoke.log
      - name: Save Electron failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-diagnostics-${{ github.run_attempt }}
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14
