[package]
name = "work-fold-chrome-host"
version = "1.0.0"
edition = "2021"
description = "work-fold's Windows Chrome native messaging bootstrap"
license = "MIT"
publish = false

[[bin]]
name = "work-fold-chrome-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
