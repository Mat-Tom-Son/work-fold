[package]
name = "work-fold-wayland"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xkbcommon = "0.9"
png = "0.18"
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "io-util", "io-std", "sync"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
